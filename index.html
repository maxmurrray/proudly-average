<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proudly Average — Something's Coming</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">

    <!-- OG / Social preview -->
    <meta property="og:title" content="Proudly Average">
    <meta property="og:description" content="Something's coming. Stay in the loop.">
    <meta property="og:image" content="https://proudlyaverage.com/og-image.png">
    <link rel="canonical" href="https://proudlyaverage.com">
    <meta property="og:url" content="https://proudlyaverage.com">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://proudlyaverage.com/og-image.png">
    <meta name="twitter:title" content="Proudly Average">

    <link rel="stylesheet" href="https://use.typekit.net/wfh3dbx.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">

        <main>
            <h1>Stay in the loop!</h1>
            <div class="form-wrapper">
                <iframe src="https://emotivecdn.io/embedded/index.html?id=2050db38-1d66-11f1-824c-0a58a9feac02&brand_id=43752&api=https%3A%2F%2Fwww.emotiveapp.co" title="Emotive Embedded for Email and SMS Marketing" style="width:100%;height:400px;border:none;box-sizing:border-box;"></iframe>
            </div>
        </main>

        <div class="logo-bottom" id="eyesLogo">
            <img src="eyes.svg" alt="Proudly Average">
        </div>
        <span class="logo-word logo-word-left">PROUDLY</span>
        <span class="logo-word logo-word-right">AVERAGE</span>

        <!-- Easter egg — hidden under the eyes, no hints given -->
        <div class="easter-egg" id="easterEgg">deffffinitely shouldn't stay in the loop…</div>

    </div>
    <script>
        /* ── Easter egg: draggable eyes, message hidden underneath ── */
        (function () {
            var logo = document.getElementById('eyesLogo');
            var msg  = document.getElementById('easterEgg');

            var dragging    = false;
            var revealed    = false;
            var dragEnabled = false;
            var startX = 0, startY = 0;
            var savedX = 0, savedY = 0;
            var currentX = 0, currentY = 0;

            function enableDrag() {
                if (dragEnabled) return;
                dragEnabled = true;
                logo.style.animation        = 'none';
                logo.style.transform        = 'translate3d(0,0,0)';
                logo.style.cursor           = 'grab';
                logo.style.touchAction      = 'none';
                logo.style.userSelect       = 'none';
                logo.style.webkitUserSelect = 'none';
            }

            logo.addEventListener('animationend', function (e) {
                if (e.animationName === 'eyes-rise') enableDrag();
            });
            setTimeout(enableDrag, 1100);

            function getClient(e) {
                var src = e.touches ? e.touches[0] : e;
                return { x: src.clientX, y: src.clientY };
            }

            function onDown(e) {
                if (!dragEnabled) return;
                e.preventDefault();
                dragging = true;
                var pt = getClient(e);
                startX = pt.x - savedX;
                startY = pt.y - savedY;
                logo.style.cursor     = 'grabbing';
                logo.style.zIndex     = '5';
                logo.style.transition = 'none';
                window.addEventListener('mousemove', onMove);
                window.addEventListener('touchmove', onMove, { passive: false });
                window.addEventListener('mouseup',   onUp);
                window.addEventListener('touchend',  onUp);
            }

            function onMove(e) {
                if (!dragging) return;
                e.preventDefault();
                var pt = getClient(e);
                currentX = pt.x - startX;
                currentY = pt.y - startY;
                logo.style.transform = 'translate3d(' + currentX + 'px,' + currentY + 'px,0)';
                if (!revealed && Math.sqrt(currentX * currentX + currentY * currentY) > 40) {
                    revealed = true;
                    msg.classList.add('visible');
                }
            }

            function onUp() {
                if (!dragging) return;
                dragging = false;
                savedX = currentX;
                savedY = currentY;
                logo.style.cursor = 'grab';
                logo.style.zIndex = '5';
                window.removeEventListener('mousemove', onMove);
                window.removeEventListener('touchmove', onMove);
                window.removeEventListener('mouseup',   onUp);
                window.removeEventListener('touchend',  onUp);
            }

            logo.addEventListener('mousedown',  onDown);
            logo.addEventListener('touchstart', onDown, { passive: false });
        })();
    </script>
</body>
</html>
